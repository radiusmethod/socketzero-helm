name: Renovate

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v42
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_SECRETS: '{"REGISTRY1_USERNAME":"${{ secrets.REGISTRY1_USERNAME }}","REGISTRY1_PASSWORD":"${{ secrets.REGISTRY1_PASSWORD }}"}'
          LOG_LEVEL: debug
