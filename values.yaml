# Default values for socketzero.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

domain: "bigbang.dev"

replicaCount: 1

# Configuration options
config: "{}"
# Alternative base64-encoded configuration
# If config_base64 is set, it will be decoded and used instead of config
config_base64: ""

image:
  repository: registry1.dso.mil/ironbank/radiusmethod/socketzero/receiver
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

license:
  organization: ""
  key: ""

nameOverride: ""
fullnameOverride: "socketzero"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podLabels: {}

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
   capabilities:
     drop:
     - ALL
   readOnlyRootFilesystem: true
   runAsNonRoot: true
   runAsUser: 65534
   runAsGroup: 65534

istio:
  enabled: true
  socketzero:
    gateways:
      - "istio-system/public"
    hosts:
      - socketzero.{{ .Values.domain }}
  # Default kiali peer authentication
  mtls:
    # STRICT = Allow only mutual TLS traffic
    # PERMISSIVE = Allow both plain text and mutual TLS traffic
    mode: STRICT

service:
  type: ClusterIP
  port: 9997

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

redis-bb:
  enabled: true

  values:
    replica:
      replicaCount: 0
    auth:
      enabled: false